[package]
name = "openpivot"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
hex = "0.4.3"
jsonwebtoken = "10.4.0"
rand = "0.10.1"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "time"] }
time = { version = "0.3.47", features = ["serde"]}
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
